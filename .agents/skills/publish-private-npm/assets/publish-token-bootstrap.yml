name: Publish npm package (token bootstrap)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
          scope: "@YOUR_NPM_ORG"

      - name: Install dependencies
        run: npm ci

      - name: Prepare stable release version
        id: release-version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync } from "node:fs";

          const readPackage = () => JSON.parse(readFileSync("package.json", "utf8"));
          const readLock = () => JSON.parse(readFileSync("package-lock.json", "utf8"));
          const versionPattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const compare = (left, right) => {
            const a = left.split(".").map(Number);
            const b = right.split(".").map(Number);
            for (let index = 0; index < 3; index++) {
              if (a[index] !== b[index]) return a[index] - b[index];
            }
            return 0;
          };
          const run = (command, args) => execFileSync(command, args, { stdio: "inherit" });

          let current = readPackage().version;
          let lockVersion = readLock().packages?.[""]?.version ?? readLock().version;
          if (!versionPattern.test(current)) throw new Error(`package.json version is not stable SemVer: ${current}`);
          if (lockVersion !== current) throw new Error(`package-lock.json version ${lockVersion} differs from package.json ${current}`);

          let previous;
          try {
            previous = JSON.parse(execFileSync("git", ["show", "HEAD^:package.json"], { encoding: "utf8" })).version;
          } catch (error) {
            if (error.status !== 128) throw error;
            previous = null;
          }
          const explicitVersion = previous !== null && current !== previous;
          if (explicitVersion && versionPattern.test(previous) && compare(current, previous) < 0) {
            throw new Error(`Version downgrade ${previous} -> ${current} is not publishable`);
          }

          if (!explicitVersion) {
            run("npm", ["version", "patch", "--no-git-tag-version"]);
            current = readPackage().version;
            lockVersion = readLock().packages?.[""]?.version ?? readLock().version;
            if (lockVersion !== current) throw new Error(`package-lock.json version ${lockVersion} differs from package.json ${current}`);

            run("git", ["config", "user.name", "github-actions[bot]"]);
            run("git", ["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
            run("git", ["add", "package.json", "package-lock.json"]);
            run("git", ["commit", "-m", `chore(release): ${current}`]);
            run("git", ["push", "origin", `HEAD:${process.env.GITHUB_REF_NAME}`]);
            console.log(`Automatic patch release committed: ${current}`);
          } else {
            console.log(`Explicit release version preserved: ${current}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `changed=true\nversion=${current}\n`);
          NODE

      # Keep these Convex steps for packaged Convex components; otherwise adapt
      # codegen and generated-file checks to the package being published.
      - name: Initialize anonymous Convex deployment
        run: npx convex init
        env:
          CONVEX_AGENT_MODE: anonymous

      - name: Regenerate component types
        run: npm run codegen
        env:
          CONVEX_AGENT_MODE: anonymous

      - name: Check generated files are current
        run: git diff --exit-code -- src/component/_generated

      - name: Verify package
        run: npm run verify

      - name: Publish current branch head
        if: steps.release-version.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is not configured."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
          local_sha="$(git rev-parse HEAD)"
          if [[ "$remote_sha" != "$local_sha" ]]; then
            echo "A newer commit superseded this run; skipping publication."
            exit 0
          fi
          npm publish --access restricted --tag latest
